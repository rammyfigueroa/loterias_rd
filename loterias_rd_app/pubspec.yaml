name: sorteosdominicanos_app
description: Sorteos Dominicanos results app
publish_to: "none"
version: 1.0.5+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6
  shared_preferences: ^2.3.5
  intl: ^0.18.1
  share_plus: ^13.3.0

  # FontAwesome icons for representing different lotteries in the UI.
  # Bump to 11.x series so that FaIconData no longer extends the final IconData class.
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#003893"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_horizontal.png
    - assets/branding/sorteos_dominicanos_header.png
    - assets/branding/sorteos_dominicanos_horizontal.png
    - assets/branding/sorteos_dominicanos_horizontal_600.png
    - assets/branding/lotteries/
