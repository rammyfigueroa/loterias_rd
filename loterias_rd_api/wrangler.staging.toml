# Isolated historical staging template. It is intentionally not deployable
# until the dedicated D1 database exists and its ID is reviewed.
name = "sorteosdominicanos-api-staging"
account_id = "f171b568e3a3a203a09ef2fd6e337a2c"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "sorteosdominicanos-db-staging"
database_id = "f31aac48-f437-4fd7-9691-a7e976010dc6"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "staging"
# Prevent accidental provider access. Staging validation uses synthetic D1 data.
SOURCE_URL = "https://staging.invalid/"
CACHE_SECONDS = "180"

# Keep scheduled updates disabled even though the Worker exports a handler.
[triggers]
crons = []

# Intentionally no routes or secrets. Access and routing require a separate
# review before any remote deployment.
